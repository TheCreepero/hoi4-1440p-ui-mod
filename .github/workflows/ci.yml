name: CI - Validate and Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  validate-and-test:
    name: Invariant Validation, Unit Tests & Packaging
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python for the parser and renderer tests
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        shell: pwsh
        run: python -m pip install --quiet pillow
      - name: Fast Engine & Syntax Pre-Flight Check
        shell: pwsh
        run: |
          ./build.ps1 -ValidateOnly

      - name: Execute Pester Test Suite
        shell: pwsh
        run: |
          ./tests/Run-Tests.ps1 -CI -OutputFile tests/test-results.xml

      - name: Test Release Packaging
        shell: pwsh
        run: |
          ./build.ps1 -Package

      - name: Verify Clean Package Staging Exclusions
        shell: pwsh
        run: |
          $zipPath = "artifacts/hoi4-1440p-ui-mod.zip"
          if (-not (Test-Path $zipPath)) {
            $zipPath = "hoi4-1440p-ui-mod.zip"
          }
          if (-not (Test-Path $zipPath)) {
            Write-Error "Package archive 'hoi4-1440p-ui-mod.zip' was not generated!"
            exit 1
          }

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $zipPath).Path)
          $forbiddenPatterns = @('^tests/', '^tools/', '^baseline/', '^reference/', '^wiki/', '^assets/', '^\.git/', '^\.github/', '^\.vscode/', '\.md$', '\.ps1$', '\.py$', '\.bat$', '\.gitkeep$')
          $violations = @()

          foreach ($entry in $zip.Entries) {
            foreach ($pat in $forbiddenPatterns) {
              if ($entry.FullName -match $pat) {
                $violations += "$($entry.FullName) (matches forbidden pattern '$pat')"
              }
            }
          }
          $zip.Dispose()

          if ($violations.Count -gt 0) {
            Write-Error "Release package contains forbidden dev files:`n$($violations -join "`n")"
            exit 1
          }

          Write-Host "[OK] Verified: hoi4-1440p-ui-mod.zip is strictly clean of tests, dev scripts, and git artifacts." -ForegroundColor Green

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: tests/test-results.xml
          retention-days: 14